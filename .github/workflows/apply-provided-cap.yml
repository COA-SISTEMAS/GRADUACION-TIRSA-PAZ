name: Apply provided graduation cap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'chore: apply provided graduation cap')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace cap
        env:
          CAP_B64: ""
      - run: |
          mkdir -p assets
          echo "$CAP_B64" | base64 -d > assets/birrete-dorado-ticket.webp
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\.cap\{.*?\.cap-tassel:after\{.*?\}', ".cap{width:38px;height:34px;position:relative;margin:0 auto 7px;background:url('assets/birrete-dorado-ticket.webp') center/contain no-repeat;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}.cap-top,.cap-base,.cap-tassel{display:none}", s, count=1, flags=re.S)
          s=re.sub(r'<div class="cap" aria-hidden="true">.*?</div>', '<div class="cap" aria-hidden="true"></div>', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'COA-SISTEMAS'
          git config user.email 'coasistemashn@gmail.com'
          git add index.html assets/birrete-dorado-ticket.webp .github/workflows/apply-provided-cap.yml
          git commit -m 'chore: apply provided graduation cap'
          git push
